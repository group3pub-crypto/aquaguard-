# Nightly: full integration suite against real PostgreSQL + Mosquitto, a load smoke test, and the
# backup -> restore drill. Failures should page someone (add a notification step for your chat).
name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  integration-and-load:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.6-bookworm
        env:
          POSTGRES_USER: aquaguard
          POSTGRES_PASSWORD: ${{ github.run_id }}-nightly-pg
          POSTGRES_DB: aquaguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aquaguard -d aquaguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://aquaguard:${{ github.run_id }}-nightly-pg@127.0.0.1:5432/aquaguard_test
      TEST_MQTT_HOST: 127.0.0.1
      TEST_MQTT_PORT: "1883"
      TEST_MQTT_USERNAME: aquaguard-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            libs/aquaguard_features/pyproject.toml
      - name: Broker secrets and Mosquitto
        run: |
          echo "TEST_MQTT_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "TEST_MQTT_DEVICE_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Start Mosquitto
        run: |
          docker run -d --name mosquitto --network host \
            -e MQTT_USERNAME="$TEST_MQTT_USERNAME" -e MQTT_PASSWORD="$TEST_MQTT_PASSWORD" \
            -e MQTT_DEVICE_SECRET="$TEST_MQTT_DEVICE_SECRET" \
            -e MQTT_DEVICES="green-valley/101,green-valley/102" \
            -v "$PWD/infra/mosquitto:/mosquitto/config:ro" \
            --entrypoint /bin/sh eclipse-mosquitto:2.0.20 /mosquitto/config/entrypoint.sh
          for i in $(seq 1 30); do
            docker run --rm --network host eclipse-mosquitto:2.0.20 mosquitto_pub -h 127.0.0.1 \
              -u "$TEST_MQTT_USERNAME" -P "$TEST_MQTT_PASSWORD" -t aquaguard/ci -m up && exit 0
            sleep 1
          done
          docker logs mosquitto; exit 1
      - run: pip install -e libs/aquaguard_features -e "backend[dev]" aiomqtt asyncpg
      - name: Integration suite
        working-directory: backend
        run: pytest tests/integration -m integration -v
        env:
          ENVIRONMENT: test
      - name: Load smoke (100 meters, 30 s, >= 95% of messages must land)
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://aquaguard:${{ github.run_id }}-nightly-pg@127.0.0.1:5432/aquaguard_loadtest
          MQTT_HOST: 127.0.0.1
          MQTT_USERNAME: aquaguard-backend
          MQTT_WORKER_CONCURRENCY: "64"
          MQTT_MAX_FUTURE_SKEW_S: "300"
          MODEL_MANIFEST_REQUIRED: "false"
        run: |
          export MQTT_PASSWORD="$TEST_MQTT_PASSWORD"
          PGPASSWORD="${{ github.run_id }}-nightly-pg" psql -h 127.0.0.1 -U aquaguard -d aquaguard_test -c 'CREATE DATABASE aquaguard_loadtest'
          (cd backend && alembic upgrade head)
          (cd backend && uvicorn app.main:app_factory --factory --port 8000 > ../backend.log 2>&1 & echo $! > ../backend.pid)
          for i in $(seq 1 40); do curl -fs http://127.0.0.1:8000/health/ready && break; sleep 1; done
          python infra/loadtest/load_test.py --meters 100 --duration 30 --interval 1.0 \
            --db-url "$DATABASE_URL" --backend-pid "$(cat backend.pid)" --min-landed-pct 95
      - if: failure()
        run: |
          docker logs mosquitto || true
          tail -n 100 backend.log || true

  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            libs/aquaguard_features/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y age postgresql-16
      - run: pip install -e libs/aquaguard_features -e backend
      - name: Backup -> restore -> compare (throw-away cluster)
        run: PGBIN=/usr/lib/postgresql/16/bin PYTHON=python bash infra/backup/restore-test.sh
