name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e "backend[dev]" pytest-cov ruff mypy
      - run: ruff check backend
      - run: ruff format --check backend
      - run: mypy backend/app
        continue-on-error: true
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml
        working-directory: backend
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-only-test-key-not-a-secret-0123456789abcdef
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          if [ -f ml/requirements.txt ]; then pip install -r ml/requirements.txt; else pip install -e ml; fi
          pip install pytest ruff
      - run: ruff check ml
      - run: pytest ml/tests

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          if [ -f edge/requirements.txt ]; then pip install -r edge/requirements.txt; else pip install -e edge; fi
          pip install pytest ruff
      - run: ruff check edge
      - run: pytest edge/tests

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e "bot[dev]" ruff
      - run: ruff check bot
      - run: pytest
        working-directory: bot

  docker:
    runs-on: ubuntu-latest
    needs: [backend, dashboard, bot]
    strategy:
      matrix:
        include:
          - {name: backend, context: backend, file: backend/Dockerfile}
          - {name: dashboard, context: dashboard, file: dashboard/Dockerfile}
          - {name: bot, context: bot, file: bot/Dockerfile}
          - {name: edge, context: ., file: edge/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit (reporting only)
        continue-on-error: true
        run: |
          pip install pip-audit
          for d in backend ml edge bot; do
            [ -f $d/requirements.txt ] && pip-audit -r $d/requirements.txt || true
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm audit (reporting only)
        continue-on-error: true
        run: cd dashboard && npm audit --audit-level=high
