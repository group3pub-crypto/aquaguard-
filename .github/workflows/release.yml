# Release: builds and pushes images to GHCR on version tags, with provenance + SBOM attestations,
# a Trivy scan (blocks on HIGH/CRITICAL) and SPDX SBOM artifacts. NOT EXECUTED yet: dry-run it on a
# fork with a throw-away tag first.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # images: ghcr.io/<owner>/aquaguard/<service>; deploy with AQUAGUARD_REGISTRY=ghcr.io/<owner>/aquaguard
  PREFIX: ${{ github.repository_owner }}/aquaguard

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless attestation
      attestations: write
    strategy:
      fail-fast: true
      max-parallel: 1       # backend must exist before models is built from it
      matrix:
        include:
          - {name: backend, context: ., file: backend/Dockerfile}
          - {name: dashboard, context: dashboard, file: dashboard/Dockerfile}
          - {name: bot, context: bot, file: bot/Dockerfile}
          - {name: backup, context: infra/backup, file: infra/backup/Dockerfile}
          - {name: models, context: ., file: ml/Dockerfile.models}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PREFIX }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Resolve the backend image the models are trained on
        id: backend
        run: echo "ref=${REGISTRY}/${PREFIX,,}/backend:${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.name == 'models' && format('BACKEND_IMAGE={0}', steps.backend.outputs.ref) || '' }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.PREFIX }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Trivy image scan (blocks on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${REGISTRY}/${PREFIX,,}/${{ matrix.name }}@${{ steps.build.outputs.digest }}"
      - name: SBOM (SPDX) with syft, checksum-verified binary
        run: |
          v=1.18.1
          curl -sSfL -o syft.tgz "https://github.com/anchore/syft/releases/download/v${v}/syft_${v}_linux_amd64.tar.gz"
          echo "066c251652221e4d44fcc4d115ce3df33a91769da38c830a8533199db2f65aab  syft.tgz" | sha256sum -c -
          tar xzf syft.tgz syft
          ./syft "${REGISTRY}/${PREFIX,,}/${{ matrix.name }}@${{ steps.build.outputs.digest }}" \
            -o spdx-json=sbom-${{ matrix.name }}.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json
