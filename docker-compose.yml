# AquaGuard stack. Requires a .env file (run `make env`).
name: aquaguard

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  postgres:
    <<: *hardening
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aquaguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aquaguard}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: {memory: 1g}

  mosquitto:
    <<: *hardening
    image: eclipse-mosquitto:2
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-aquaguard}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/entrypoint.sh:/entrypoint.sh:ro
      - mosquitto_data:/mosquitto/data
    tmpfs: ["/tmp"]
    read_only: true
    ports: ["127.0.0.1:1883:1883"]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u \"$${MQTT_USERNAME}\" -P \"$${MQTT_PASSWORD}\" -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: {memory: 256m}

  backend:
    <<: *hardening
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (openssl rand -hex 32)}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aquaguard}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-aquaguard}
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USERNAME: ${MQTT_USERNAME:-aquaguard}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_RESIDENT_PASSWORD: ${DEMO_RESIDENT_PASSWORD:-}
      MODEL_DIR: /app/ml/models
      BACKEND_LOG_LEVEL: ${BACKEND_LOG_LEVEL:-info}
      WATSONX_API_KEY: ${WATSONX_API_KEY:-}
      WATSONX_PROJECT_ID: ${WATSONX_PROJECT_ID:-}
    volumes:
      - ./ml/models:/app/ml/models:ro
    tmpfs: ["/tmp"]
    read_only: true
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      mosquitto: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits: {memory: 1g}

  dashboard:
    <<: *hardening
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 512m}

  simulator:
    <<: *hardening
    profiles: ["demo"]
    build:
      context: .
      dockerfile: edge/Dockerfile
    command: ["python", "-m", "edge.simulator", "--society", "demo", "--flats", "6", "--speed", "60", "--broker", "mosquitto:1883"]
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-aquaguard}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      mosquitto: {condition: service_healthy}
      backend: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 256m}

  bot:
    <<: *hardening
    profiles: ["bot"]
    build: ./bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
      BOT_API_BASE_URL: http://backend:8000
      BOT_API_USERNAME: ${BOT_API_USERNAME:-bot_service}
      BOT_API_PASSWORD: ${BOT_API_PASSWORD:?set BOT_API_PASSWORD in .env}
      BOT_STATE_FILE: /state/links.json
    volumes:
      - bot_state:/state
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      backend: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 256m}

volumes:
  pgdata:
  mosquitto_data:
  bot_state:
