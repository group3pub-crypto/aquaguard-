[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aquaguard-ml"
version = "0.1.0"
description = "AquaGuard leak-detection and demand-forecast training pipeline (synthetic data)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "pyarrow>=14",
]

[project.optional-dependencies]
extras = ["lightgbm>=4.0", "shap>=0.44"]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools]
packages = ["ml", "ml.features", "ml.scripts"]
package-dir = { "ml" = "." }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
