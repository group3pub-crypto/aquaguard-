# OPTIONAL log shipping to Loki - UNTESTED. Containers log JSON to stdout (backend: structlog,
# Caddy: access log), so a Docker-socket Promtail with the json pipeline is enough. Mounting
# the Docker socket gives Promtail host-level power: run it read-only and only if you accept that,
# or use the Loki Docker logging driver instead.
server: {http_listen_port: 9080}
positions: {filename: /tmp/positions.yaml}
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.project=aquaguard"]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
    pipeline_stages:
      - json:
          expressions: {level: level, event: event}
      - labels: {level:}
