# EXAMPLE - UNTESTED (no Prometheus/Docker available when written). Used by
# docker-compose.monitoring.yml. The backend exposes /metrics only when METRICS_ENABLED=true and
# requires `Authorization: Bearer $METRICS_TOKEN` (>= 24 chars). /metrics is NOT routed by the
# public reverse proxy; Prometheus reaches it on the private compose network.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: aquaguard-backend
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["backend:8000"]
  # Optional exporters (add the containers yourself): postgres_exporter, mosquitto-exporter,
  # cadvisor. The alert rules below only use the backend's own metrics and `up`.
