[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aquaguard-edge"
version = "0.1.0"
description = "AquaGuard MQTT edge sensor simulator"
requires-python = ">=3.11"
dependencies = ["aiomqtt>=2.0", "pydantic>=2.5", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools]
packages = ["edge", "edge.simulator"]
package-dir = { "edge" = "." }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
